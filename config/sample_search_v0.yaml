# 견본 검색 규칙 sample_search_v0 (#5). 의류 치수표와 가장 비슷한 견본 1개를 고르는 기준이다.
#
# 값은 팀 문서 `docs/decisions.md`의 "1주차 기준 [제안]" 4절(견본 검색 규칙)을 따른다.
# 값을 바꾸면 version을 올려 이전 결과를 재현할 수 있게 한다. (아직 머지 전이라 올리지 않았다.)
#
# dimensions의 name은 GarmentMeasurements 필드 이름이다. 단위는 모두 cm이고, 가슴은 둘레다.
# 허리는 비교하지 않는다(AI Hub 의류는 허리 위치가 확인되지 않았고, 견본에는 허리 측정 정의가 없다).
# 순서는 결과의 compared·skipped 순서와 같다.
# - weight: 점수에 곱하는 가중치(0보다 커야 한다). 점수 = Σ(weight × |견본 − 의류|) ÷ Σ(weight)
#   의류에 값이 없는 선택 치수는 빼고, 남은 치수의 가중치 합으로 나눈다.
# - required: 의류에 꼭 있어야 하는가. true인 치수가 의류에 없으면 검색하지 않는다.
#   (계약의 READY 조건과 같다: 가슴·어깨.) 견본은 여기 적힌 치수가 모두 있어야 후보가 되고,
#   하나라도 없으면 그 견본만 후보에서 뺀다.
#
# 어깨 항은 지금 순위에 영향이 거의 없다. 견본의 어깨가 모두 같기 때문이다(GarmentCode가 어깨를
# 바꾸지 못함, C2 기록). 드롭 숄더를 표현한 뒤부터 의미가 생긴다.
version: sample_search_v0

# 점수를 소수 몇째 자리까지 반올림할지. 반올림한 점수로 순위와 동률을 가른다.
# 팀 문서의 "거리 차이가 0.01 cm 미만이면 동률"은 "0.01 cm로 반올림한 점수가 같으면 동률"로
# 구현한다. 순서가 입력과 상관없이 항상 일관되게 하려는 해석이다. 동률이면 가슴 차이가 작은
# 견본, 그래도 같으면 견본 ID 사전순이다.
score_decimals: 2

# 비교한 모든 치수의 차이 절댓값이 이 값 이하(경계 포함)면 결과에 exact_match: true를 적는다.
# 고르는 견본은 점수 순서 그대로다.
exact_match_tolerance_cm: 0.5

dimensions:
  - name: chest_girth_cm
    weight: 0.4
    required: true
  - name: shoulder_width_cm
    weight: 0.3
    required: true
  - name: body_length_cm
    weight: 0.2
    required: false
  - name: sleeve_length_cm
    weight: 0.1
    required: false
