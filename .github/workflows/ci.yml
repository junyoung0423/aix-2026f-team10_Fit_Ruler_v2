name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: python (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 설치
        run: pip install -e ".[dev]"

      - name: 린트
        run: ruff check .

      # blender·smpl·fal 마커 테스트는 pyproject의 addopts로 빠진다.
      - name: 테스트
        run: pytest

  # 웹(A): lint·타입 검사·테스트·빌드 (A1에서 추가)
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 타입 검사
        run: npm run typecheck

      # 가짜 API를 팀 계약 예시(docs/api/examples)와 비교한다.
      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build
