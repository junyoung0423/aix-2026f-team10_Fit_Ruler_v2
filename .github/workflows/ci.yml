name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: python (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 설치
        run: pip install -e ".[dev]"

      - name: 린트
        run: ruff check .

      # blender·smpl·fal 마커 테스트는 pyproject의 addopts로 빠진다.
      - name: 테스트
        run: pytest

  # 웹 lint·타입 검사·빌드는 A1에서 web/을 만들 때 여기에 job을 추가한다.
