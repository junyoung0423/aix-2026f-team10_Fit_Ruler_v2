[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimax-fitting"
version = "0.0.0"
description = "AIMAX 반팔 티셔츠 가상 피팅: 핏 리포트, 3D 착장, 실사화 검증"
requires-python = ">=3.10"
# 각 PR이 필요한 의존성을 여기에 추가한다 (예: B1 pydantic, B2 fastapi).
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0.1,<7",  # B2: 핏 기준표 config/*.yaml
    "fastapi>=0.115,<1",  # B2: 핏 API (server/)
    "uvicorn>=0.30,<1",  # B2: 핏 API 실행
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",  # B2: FastAPI TestClient
    "jsonschema>=4.20",
    "pytest>=8",
    "ruff>=0.5",
]
# C2: GarmentCode·Blender 스파이크 어댑터(fitting/adapters/garmentcode·blender)의 순수 계산 부분.
# 이전 pipelines/garment/requirements.txt 기준. libigl·cgal·pygarment(GarmentCode)·bpy는 넣지 않는다.
# GarmentCode는 별도 Python 3.9 가상환경, bpy는 Blender 안에서만 쓴다(docs/spikes/garmentcode-blender.md).
garment = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "trimesh>=4,<5",
    "svgpathtools>=1.6,<2",
]
# D1: fal/LTX 실사화 스파이크(fitting/adapters/fal_ltx)와 영상 프레임 추출(fitting/adapters/media).
# 테스트는 가짜 fal 클라이언트만 쓴다. 실제 호출은 FAL_KEY가 있을 때 tools.spike_fal_ltx --yes로만 한다.
realize = [
    "fal-client>=1.0.3,<2",
    "httpx>=0.27,<1",
    "opencv-python-headless>=4.10,<6",
    "numpy>=1.26,<3",
]
# D2: SMPL 몸 읽기(fitting/adapters/smpl, torch·chumpy 없이 numpy)와 신체 측정(fitting/body),
# 확인 그림(tools.smpl_body). SMPL 모델 파일은 각자 받는다(docs/spikes/smpl-body-measure.md).
body = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "opencv-python-headless>=4.10,<6",
]

[tool.setuptools.packages.find]
include = ["fitting*", "server*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Blender·GarmentCode·SMPL·fal이 필요한 테스트는 마커를 붙이고 CI에서 뺀다.
# 로컬에서 돌릴 때: pytest -m blender (또는 garmentcode, smpl, fal)
addopts = "-ra -m 'not blender and not garmentcode and not smpl and not fal'"
markers = [
    "blender: Blender가 설치된 PC에서만 실행",
    "garmentcode: GarmentCode와 그 가상환경(Python 3.9)이 있는 PC에서만 실행",
    "smpl: SMPL 모델 파일이 있는 PC에서만 실행",
    "fal: fal API를 실제로 호출 (비용 발생)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# C2: 이전 저장소(pipelines/garment/)에서 옮긴 스파이크 코드. 긴 줄만 그대로 둔다
# (이전 코드와 줄 단위로 비교하기 쉽게). 새로 쓰는 코드는 100자를 지킨다.
"fitting/adapters/blender/{analyze_drape,blender_drape,drape_config,drape_measure,metrics,run_drape,weld}.py" = ["E501"]
"fitting/adapters/garmentcode/{coords,export_panels,pattern_measure}.py" = ["E501"]
"tests/garment/test_{coords,drape_measure,export,metrics,pattern_measure,weld}.py" = ["E501"]
"tools/make_drape_config.py" = ["E501"]
